<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Vía del Milisegundo // El Mostrador Principal de la Posta 1001</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-base: #060913;
            --panel-bg: #0f172a;
            --border-line: #1e293b;
            --gold-accent: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --screen-green: #34d399;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .main-container {
            background-color: var(--panel-bg);
            border: 3px solid var(--border-line);
            border-top: 5px solid var(--gold-accent);
            padding: 35px;
            border-radius: 8px;
            width: 100%;
            max-width: 720px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
        }

        .header-section {
            text-align: center;
            border-bottom: 1px solid var(--border-line);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .tag-oficial {
            font-size: 0.7rem;
            color: var(--gold-accent);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 1.25rem;
            color: #ffffff;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .sub-header {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 5px;
            font-style: italic;
        }

        .viewport-box {
            background-color: #020408;
            border: 2px inset var(--border-line);
            border-radius: 6px;
            padding: 25px;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 25px;
            text-align: left;
        }

        #story-output {
            font-size: 0.85rem;
            line-height: 1.8;
            color: var(--screen-green);
        }

        #story-output b {
            color: #fbbf24;
        }

        .controls-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-nav {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid #475569;
            padding: 12px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
            font-weight: bold;
            flex: 1;
            transition: all 0.2s;
        }

        .btn-nav:hover {
            background: #334155;
            border-color: var(--gold-accent);
            color: var(--gold-accent);
        }

        .counter-display {
            font-size: 0.75rem;
            color: var(--text-muted);
            min-width: 70px;
            text-align: center;
        }

        /* Sección del taller de la Fiat 147 1100 (Estampadora Multifecha) */
        .workshop-section {
            background-color: #080c14;
            border: 1px dashed #334155;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
        }

        .workshop-title {
            font-size: 0.8rem;
            color: var(--gold-accent);
            margin-bottom: 12px;
            letter-spacing: 1px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .input-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .input-row input[type="text"] {
            background: #111827;
            border: 1px solid #4b5563;
            color: #fff;
            padding: 8px;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 4px;
            text-align: center;
            width: 130px;
        }

        .input-row input[type="file"] {
            font-size: 0.7rem;
            color: #fff;
        }

        .btn-stamp {
            background: linear-gradient(135deg, #b91c1c, #dc2626);
            color: #ffffff;
            border: 1px solid #f87171;
            padding: 12px 20px;
            width: 100%;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
        }

        .btn-stamp:hover {
            filter: brightness(1.15);
        }

        .footer-mostrador {
            margin-top: 25px;
            font-size: 0.65rem;
            color: #475569;
            text-align: center;
            border-top: 1px solid var(--border-line);
            padding-top: 15px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="main-container" id="areaCapturable">
        <div class="header-section">
            <div class="tag-oficial">Posta 1001 // Ventaniya Oficial</div>
            <h1>El Mostrador Principal de la Vía del Milisegundo</h1>
            <div class="sub-header">Un viaje mágico y real operando desde Mar del Plata</div>
        </div>

        <div class="viewport-box">
            <div id="story-output">
                <!-- Carga de diálogo -->
            </div>
        </div>

        <div class="controls-panel">
            <button class="btn-nav" onclick="cambiarPagina(-1)">&larr; ANTERIOR</button>
            <div class="counter-display" id="pageCount">01 / 05</div>
            <button class="btn-nav" onclick="cambiarPagina(1)">SIGUIENTE &rarr;</button>
        </div>

        <!-- Taller de la Estampadora de Multifecha (Fiat-1100-47a) -->
        <div class="workshop-section">
            <div class="workshop-title">🛠️ ESTAMPADORA DE MULTIFECHA: FIAT-1100-47A</div>
            <div class="input-row">
                <span>Fecha Elegida:</span>
                <input type="text" id="customDate" value="21/09/1994">
                <span>Imagen (PNG/JPG):</span>
                <input type="file" id="customImage" accept="image/*">
            </div>
            <button class="btn-stamp" onclick="emitirEstampaPersonalizada()">🚀 ACTIVAR MOTOR 1100 Y DESCARGAR ESTAMPIYA!</button>
        </div>

        <div class="footer-mostrador">
            COLECCIONABLE ORIGINAL DE LA VÍA DEL MILISEGUNDO // MAR DEL PLATA
        </div>
    </div>

    <script>
        const historiaOficial = [
            "<b>1. El Descubrimiento de la Vía del Milisegundo:</b><br>Hola, bienvenido. Queremos contarte algo hermoso que descubrimos casi sin querer: la <i>Vía del Milisegundo</i>. Pusimos en marcha la <b>Posta 1001</b> operando directamente desde Mar del Plata, un punto de encuentro donde el tiempo deja de ser abstracto y se convierte en una obra de arte para coleccionar.",
            "<b>2. La Magia de las EstampiYA! de Tiempo:</b><br>Para lograrlo, inventamos la máquina <b>estampadora de estampillas 1001</b>. Su trabajo es sencillo y fascinante: estampa la línea exacta del milisegundo en que ocurren las cosas (por ejemplo: <i>04/08/2026 - 09:33:59.000</i>), creando las <i>estampiYA!</i> de tiempo en más de 200 variedades visuales únicas.",
            "<b>3. El Poder Orbital de la AR-1000-A:</b><br>A eso le sumamos la máquina <b>AR-1000-A</b>, un dispositivo especial que toma la línea de tiempo y le inyecta información satelital y estética en distintas variedades. Fusiona tus fotos urbanas, murales y recuerdos con sellos visuales de altísima calidad.",
            "<b>4. La Vía Comercial del Milisegundo:</b><br>Esto se pone mejor en los comercios de barrio, empresas líderes y ciudades de la Vía. Cuando visitás un local, el comercio te regala una <b>estampiYA! de tiempo</b> como recuerdo exclusivo de su marca y de la ciudad. Es una pieza de colección original para guardar para siempre, un detalle de distinción para el cliente.",
            "<b>5. Tradición y Romantización del Fechador:</b><br>Y para completar esta locura linda, sumamos la nueva máquina estampadora de multifecha: la <b>fiat-1100-47a</b>. Acá no hay vueltas raras ni dialectos complejos; es puro romanticismo de fechadores puros donde elegís tu propia fecha para tus imágenes en PNG o JPG y te llevás tu estampilla original al instante."
        ];

        let indiceHistoria = 0;

        function renderizarPagina() {
            document.getElementById('story-output').innerHTML = historiaOficial[indiceHistoria];
            document.getElementById('pageCount').textContent = `0${indiceHistoria + 1} / 0${historiaOficial.length}`;
        }

        function cambiarPagina(direccion) {
            indiceHistoria += direccion;
            if (indiceHistoria < 0) {
                indiceHistoria = historiaOficial.length - 1;
            } else if (indiceHistoria >= historiaOficial.length) {
                indiceHistoria = 0;
            }
            renderizarPagina();
        }

        function emitirEstampaPersonalizada() {
            const fecha = document.getElementById('customDate').value;
            alert(`⚡ ¡MOTOR 1100 EN MARCHA!\n\nEstampilla generada con éxito.\nFecha seleccionada: [ ${fecha} ]\nA través de la estampadora Fiat-1100-47a.\n\nPreparando descarga de la pieza de colección...`);
            
            setTimeout(() => {
                const elemento = document.getElementById('areaCapturable');
                html2canvas(elemento, { backgroundColor: '#0f172a', scale: 2 }).then(canvas => {
                    const enlace = document.createElement('a');
                    enlace.download = `EstampiYA-Mil100-${fecha.replace(/\//g, '-')}.png`;
                    enlace.href = canvas.toDataURL('image/png');
                    enlace.click();
                });
            }, 500);
        }

        renderizarPagina();
    </script>
</body>
</html>
